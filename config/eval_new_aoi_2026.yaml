# Separate evaluation (v0.4 part 3): the existing baselines on a new AOI and period.
# Written before any discovery or scoring. config/default.yaml, examples/ and reference/ are untouched.
project: deltawatch-eval-new-aoi-2026

stac:
  api_url: https://earth-search.aws.element84.com/v1
  collection: sentinel-2-c1-l2a
  max_items: 500
  discovery_max_scene_cloud_pct: 60      # same discovery filter as v0.2

aoi:
  crs: EPSG:4326
  bbox: [31.60, 30.60, 31.65, 30.65]     # candidate: eastern Nile Delta (west, south, east, north)

time:
  start: "2026-05-20"
  end: "2026-09-30"

tile:
  preferred_mgrs: auto                   # resolved by the rule below, never by a score

assets: {red: red, nir: nir, scl: scl}

quality:                                 # identical to config/default.yaml (same processing fingerprint)
  scl_usable_classes: [4, 5, 6]
  ndvi_denominator_min: 1.0e-4
  require_positive_reflectance: true
  dilation_classes: [3, 8, 9, 10]
  dilation_radius_px: 2

selection:
  min_usable_fraction: 0.70
  target_dates: 12
  min_dates: 8
  min_gap_days: 10
  window_start: "2026-05-20"
  window_end: "2026-09-30"

network:
  gdal_http_timeout_s: 30
  gdal_http_max_retry: 3
  gdal_http_retry_delay_s: 2
  stac_max_retries: 3

outputs:
  dir: evaluations/new_aoi_2026/run

benchmark:                               # baseline settings unchanged from v0.2
  max_age_days: 30
  median_k: 3
  hidden_fraction: 0.10
  block_px: 20
  max_block_attempts: 20000
  validation: {date: "2025-05-17", seed: 101}   # v0.2 values kept for config compatibility; not used here
  test: {date: "2025-06-23", seed: 202}

evaluation:
  # Tile rule (fixed before discovery): use the tile whose grid contains the whole AOI. If more than
  # one does, take the one with the most deduplicated dates with usable_fraction >= 0.70 inside the
  # window; ties -> alphabetically first tile ID.
  tile_rule: "single covering tile; else most eligible dates; tie -> alphabetical"
  # Mechanical-only fallbacks, tried in order, once each: fewer than min_dates eligible dates or a
  # processing failure. Never changed because of an error metric or score.
  fallback_aois:
    - {name: lake, bbox: [30.50, 30.60, 30.55, 30.65]}
    - {name: minya, bbox: [30.80, 28.10, 30.85, 28.15]}
  # Targets: every frozen date with at least 2 earlier frozen dates within max_age_days (dates only).
  min_earlier_dates_within_age: 2
  seeds: [301, 302, 303, 304, 305]       # mask layouts only; not independent datasets
  bootstrap:
    unit: hidden 20x20 blocks as generated by block_mask for that (target, seed)
    n_resamples: 1000
    seed: 20260520
    ci: [2.5, 97.5]
