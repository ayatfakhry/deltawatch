[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltawatch"
version = "0.4.0"
description = "Reproducible, quality-controlled Sentinel-2 NDVI pipeline (public data, CPU only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "rasterio>=1.4",
  "pystac-client>=0.8",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.16.9"]
# Distribution layer only (COG + STAC + local query). The NDVI pipeline does not need or import these.
# Versions are the ones the distribution tests passed with on 2026-11-23; rio-cogeo needs Python >= 3.11.
distribution = ["rio-cogeo==7.0.4", "pystac[validation]==1.16.1"]
query = ["fastapi==0.165.0", "uvicorn==0.54.0", "httpx2==2.16.2"]

[project.scripts]
deltawatch = "deltawatch.pipeline:main"
deltawatch-dist = "deltawatch.distribution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702"]
